<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inspector — TopolGuard</title>
  <meta name="description" content="Upload a .obj file and audit its topology — non-manifold edges, skinny triangles, n-gons, flipped normals. Runs entirely in your browser.">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-page="app">

<div id="toast-container"></div>

<!-- UNIFIED TOPNAV (Inspector variant) -->
<nav class="tg-topnav">
  <a href="index.html" class="brand"><span class="brand-mark">▲</span><span class="brand-text">TopolGuard</span></a>
  <div class="links">
    <a href="manual.html">Manual</a>
    <a href="app.html" class="active">Inspector</a>
  </div>

  <div class="inspector-ctrl">
    <div class="menu-wrap">
      <button class="icon-btn" id="topnav-menu-btn" title="OPTIONS">⋮</button>
      <div class="menu-dropdown" id="topnav-menu-dropdown">
        <div class="menu-row">
          <span>BOUNDING BOX</span>
          <button class="mini-toggle" id="bbox-toggle" data-on="true"></button>
        </div>
        <div class="menu-row slider-row">
          <div class="slider-header">
            <span>MARKER SIZE</span>
            <span class="slider-val" id="marker-size-val">1.0×</span>
          </div>
          <input type="range" id="marker-size-slider" min="0.2" max="3.0" step="0.1" value="1.0">
        </div>
      </div>
    </div>
    <button id="anim-icon-btn" class="icon-btn" onclick="toggleAnimSetting()" title="로딩 애니메이션 켜짐 — 누르면 끔" aria-pressed="true">⏸</button>
  </div>
</nav>

<div id="app-body">

<div id="sidebar" class="results-sidebar">
  <div id="sidebar-body">

    <!-- MODELING SCORE -->
    <div id="health-card" class="health-card-hero">
      <div class="health-label">MESH SCORE</div>
      <div class="health-score-row">
        <div id="health-score-val" style="color:var(--dim);">—</div>
        <div class="health-score-meta">
          <div id="health-grade" style="color:var(--dim);">N/A</div>
        </div>
      </div>
      <div id="health-desc">파일을 업로드하면 품질 점수를 계산해요</div>
      <div id="health-bar-wrap"><div id="health-bar-fill" style="width:0%;background:var(--dim);"></div></div>
    </div>

    <!-- MESH INFO -->
    <div class="stat-grid stat-grid-stack">
      <div class="stat-card-mesh-row">
        <div class="stat-cell"><div class="stat-label">VERTICES</div><div class="stat-value" id="v-count">—</div></div>
        <div class="stat-cell"><div class="stat-label">FACES</div><div class="stat-value" id="f-count">—</div></div>
      </div>
    </div>
    <!-- DOM compatibility placeholders -->
    <div style="display:none;">
      <span id="e-count"></span>
      <span id="euler"></span>
      <span id="bbox"></span>
    </div>

    <!-- TOPOLOGY ISSUES -->
    <div id="issue-list">
      <div id="issue-cards-container">
        <div class="issue-empty-state">
          <div class="issue-empty-glyph">⬡</div>
          <div>.obj 파일을 올려주세요</div>
        </div>
      </div>
    </div>

    <!-- OVERLAY COLORS -->
    <div class="section-title">OVERLAY COLORS</div>
    <div id="overlay-colors-panel" style="margin-bottom:6px;">
      <button onclick="resetColors()" class="reset-colors-btn">↺ RESET</button>
    </div>

  </div><!-- /sidebar-body -->
  <div id="sidebar-footer">
    <div id="progress-wrap">
      <div id="progress-bar"><div id="progress-fill"></div></div>
      <div id="progress-label">분석 중이에요...</div>
    </div>
  </div>
</div>

<div id="viewport">
  <!-- SCAN LINE (분석 중 연출) -->
  <div class="scan-line" id="scan-line"></div>

  <div id="viewport-controls">
    <div class="view-modes" id="topnav-view-modes">
      <button class="active" data-mode="wireframe">WIRE</button>
      <button data-mode="solid">SOLID</button>
      <button data-mode="both">BOTH</button>
      <button data-mode="heatmap">DENSITY</button>

      <div class="density-popover" id="density-popover">
        <span style="color:#3b82f6;">●</span>
        <span>LOW</span>
        <div class="hm-grad"></div>
        <span>HIGH</span>
        <span style="color:#ef4444;">●</span>
        <span class="density-popover-label">VERTEX DENSITY</span>
      </div>
    </div>
  </div>

  <!-- SKIP ANIMATION 버튼 -->
  <button id="skip-btn" onclick="skipAnimation()">⏭ SKIP</button>

  <!-- LOAD-FIRST DROPZONE -->
  <div id="quick-start" class="visible">
    <label class="viewport-dropzone" for="file-upload">
      <span class="dropzone-title">OBJ 파일을 여기로 드래그하거나 클릭하세요</span>
      <span class="dropzone-subtitle">또는 우측 SAMPLES에서 하나를 선택하세요</span>
    </label>
  </div>

  <!-- DROP HOVER 오버레이 -->
  <div id="drop-overlay" style="display:none;">
    <div class="drop-icon">⬡</div>
    <div class="drop-text">여기에 .OBJ 드롭</div>
    <div class="drop-sub">WAVEFRONT OBJ FORMAT</div>
  </div>
  <div id="hud">
    <div>스크롤 — 확대</div><div>드래그 — 회전</div><div>우클릭 — 이동</div>
  </div>
  <label id="upload-btn" for="file-upload">▲ UPLOAD .OBJ</label>
  <input type="file" id="file-upload" accept=".obj" style="display:none;">
</div>

<!-- RIGHT GALLERY — HISTORY + SAMPLES -->
<div id="side-panel" class="side-panel gallery-sidebar expanded">
  <div class="side-panel-body">
    <div class="side-panel-section history-section">
      <div class="section-header">
        <span class="section-title">HISTORY</span>
      </div>
      <div class="section-content">
        <ul id="history-list">
          <li id="history-empty" aria-hidden="true"></li>
        </ul>
      </div>
    </div>

    <div class="side-panel-section samples-section">
      <div class="section-header">
        <span class="section-title">SAMPLES</span>
      </div>
      <div class="section-content">
        <button class="sample-btn sample-entry" id="sample-ai-btn" data-file="Humanoid_AI.obj">
          <span class="sample-thumb">
            <img src="assets/samples/ai-origin.png" alt="" loading="lazy" onerror="this.style.display='none'">
            <span class="sample-thumb-fallback">AI</span>
          </span>
          <span class="sample-name">AI ORIGIN</span>
          <span class="sample-meta">4,853 verts · 9,445 faces</span>
        </button>
        <button class="sample-btn sample-entry" id="sample-human-btn" data-file="Humanoid_Human_Modified.obj">
          <span class="sample-thumb">
            <img src="assets/samples/human-touched.png" alt="" loading="lazy" onerror="this.style.display='none'">
            <span class="sample-thumb-fallback">HU</span>
          </span>
          <span class="sample-name">HUMAN TOUCHED</span>
          <span class="sample-meta">4,455 verts · 8,438 faces</span>
        </button>
      </div>
    </div>
  </div>
</div>

<div id="history-preview" class="history-preview hidden">
  <img id="history-preview-img" src="" alt="preview">
</div>

</div>

<!-- Three.js + loaders (CDN, 순서 중요) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>

<!-- App logic -->
<script type="module" src="js/main.js"></script>
</body>
</html>
